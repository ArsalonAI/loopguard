[project]
name = "loopguard"
version = "0.1.0"
description = "A controlled experiment measuring how tool-using agent reliability degrades with loop depth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Config, schemas, and the contract between pipeline stages.
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # HTTP client for the OpenAI-compatible wire format (TRD 1). No OpenAI
    # model, key, or service is involved -- base_url points at the open-weight
    # provider chosen in Phase 0.
    "openai>=1.40",
    # Statistics (Phase 2+). Pinned into the env now so the analysis
    # environment is reproducible from uv.lock at every phase.
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    # Payload length-matching against a reference tokenizer (TRD 5.3, Phase 1).
    "tokenizers>=0.19",
]

[project.scripts]
loopguard = "loopguard.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopguard"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# prd.md and trd.md contain illustrative Python; ruff would reformat those code
# blocks and silently rewrite the specification.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008", # function call in default arg -- pydantic Field() idiom
]

[tool.ruff.lint.isort]
known-first-party = ["loopguard"]

# ---------------------------------------------------------------------------
# Types
#
# TRD 1: strict on loopguard/schemas and loopguard/grading -- the schemas and
# the resolver are where a silent type error becomes a wrong number. Strictness
# elsewhere is optional.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true

# Third-party stubs use syntax newer than our 3.11 floor; analysing them tells us
# nothing about this codebase and would block checking of everything downstream.
[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "statsmodels.*", "pandas.*", "tokenizers.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["loopguard.schemas.*", "loopguard.grading.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
extra_checks = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_provider'"
markers = [
    "live_provider: hits a real provider endpoint; excluded from CI by default (TRD 12)",
]
